services:
  postgres:
    image: postgres:16
    container_name: webhawk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - webhawk_pg_data:/var/lib/postgresql/data
      - ./db/users.sql:/docker-entrypoint-initdb.d/01-users.sql
      - ./db/security.sql:/docker-entrypoint-initdb.d/02-security.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  users-service:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    container_name: webhawk-users
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  security-engine:
    build:
      context: .
      dockerfile: services/security-engine/Dockerfile
    container_name: webhawk-security
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  webhawk_pg_data: