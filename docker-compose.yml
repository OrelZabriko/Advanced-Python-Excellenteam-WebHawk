version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: webhawk_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    restart: always

  security_engine:
    build:
      context: .
      dockerfile: services/security_engine/Dockerfile
    container_name: webhawk_security
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      # Overrides DB_HOST from .env - inside Docker, "postgres" is the
      # service name above, resolved automatically by Docker's internal DNS.
      - DB_HOST=postgres

  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    container_name: webhawk_users
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - DB_HOST=postgres

  backend_registry:
    build:
      context: .
      dockerfile: services/backend_registry/Dockerfile
    container_name: webhawk_backend_registry
    ports:
      - "8083:8080"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - DB_HOST=postgres

  # middleware is not implemented yet. Uncomment once its code lands, so
  # `docker compose up` keeps working in the meantime instead of failing
  # on a missing Dockerfile.
  # middleware:
  #   build:
  #     context: .
  #     dockerfile: middleware/Dockerfile
  #   container_name: webhawk_middleware
  #   # The ONLY service reachable from outside Docker - the project's single
  #   # public entry point. Everything else is internal-only (see above).
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - postgres
  #     - security_engine
  #     - users
  #     - backend_registry
  #   env_file:
  #     - .env